<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Banking - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="top-nav">
    <strong>Secure Banking</strong>
    <a href="index.html">Login</a>
    <a href="accounts.html">Accounts</a>
    <a href="transactions.html">Transactions</a>
    <a href="admin.html">Admin</a>
  </nav>

  <main class="page">
    <section class="panel narrow">
      <h1>Login</h1>
      <form id="loginForm" class="form">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </section>

    <section class="panel narrow">
      <h2>Register</h2>
      <form id="registerForm" class="form">
        <input id="registerName" type="text" placeholder="Name" required>
        <input id="registerEmail" type="email" placeholder="Email" required>
        <input id="registerPassword" type="password" placeholder="Password" required>
        <select id="registerRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <select id="registerAccountType">
          <option value="savings">Savings</option>
          <option value="current">Current</option>
        </select>
        <button type="submit">Register</button>
      </form>
    </section>

    <p id="message"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
